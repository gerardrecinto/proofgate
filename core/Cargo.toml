[package]
name = "proofgate"
version = "0.1.0"
edition = "2021"
description = "Exact semantic diff and invariant proofs for access policies"
license = "MIT"
repository = "https://github.com/gerardrecinto/proofgate"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "proofgate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
opt-level = 3
strip = true
