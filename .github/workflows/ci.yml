name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
      - run: cargo test

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: cargo build --release
        working-directory: core
      - run: gofmt -l . | tee /dev/stderr | (! read)
        working-directory: gateway
      - run: go vet ./...
        working-directory: gateway
      - name: Concurrent approvals remain bound to the active policy
        run: go test -race -run TestConcurrentProposalsCannotReuseAnObsoleteBaseApproval -count=20 ./...
        working-directory: gateway
      - name: Tests, including conformance against the Rust evaluator
        run: go test -race -count=1 ./...
        working-directory: gateway
        env:
          PROOFGATE_BIN: ${{ github.workspace }}/core/target/release/proofgate

  ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.7", "3.1", "3.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: cargo build --release
        working-directory: core
      - run: ruby -Ilib -Itest test/builder_test.rb
        working-directory: dsl
        env:
          PROOFGATE_BIN: ${{ github.workspace }}/core/target/release/proofgate

  examples-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: make examples
      - name: Compiled examples match their Ruby source
        run: git diff --exit-code examples

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./scripts/build-site.sh
      - name: The WebAssembly build agrees with the CLI
        run: node scripts/wasm-smoke.mjs
