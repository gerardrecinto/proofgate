name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - { language: go, mode: manual }
          - { language: ruby, mode: none }
          - { language: actions, mode: none }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: stable
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
      - if: matrix.mode == 'manual'
        run: go build ./...
        working-directory: gateway
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
